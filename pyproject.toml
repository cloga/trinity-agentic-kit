[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [
  "packages/social-publish-core/src",
  "packages/value-audit-core/src",
  "packages/value-investing-explainer/src",
  "skills/lynch-research",
  "scripts",
  "skills/value-investing-explainer",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = [
  "packages/social-publish-core/src",
  "packages/value-audit-core/src",
  "packages/value-investing-explainer/src",
  "skills/lynch-research/validate.py",
  "skills/value-investing-explainer/validate.py",
  "tests",
  "examples",
  "scripts",
]
exclude = ["**/__pycache__", "build", "dist"]
venvPath = "."
reportMissingTypeStubs = false
