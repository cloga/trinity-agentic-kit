name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce neutral branch naming
        if: github.event_name == 'pull_request'
        run: python scripts/validate_branch_name.py --branch "${{ github.head_ref }}"

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/social-publish-core[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python -m pytest --cov=trinity_agentic_kit.social_publish --cov-report=term-missing --cov-fail-under=90
      - run: python -m build packages/social-publish-core
