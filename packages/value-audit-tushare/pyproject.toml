[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trinity-agentic-kit-value-audit-tushare"
version = "0.1.0"
description = "Point-in-time Tushare adapter for trinity-agentic-kit-value-audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "cloga contributors" }]
keywords = ["finance", "valuation", "tushare", "provenance", "point-in-time"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["trinity-agentic-kit-value-audit>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
value-audit-tushare = "trinity_agentic_kit.value_audit_tushare.cli:main"

[project.urls]
Homepage = "https://github.com/cloga/trinity-agentic-kit"
Issues = "https://github.com/cloga/trinity-agentic-kit/issues"
Source = "https://github.com/cloga/trinity-agentic-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/trinity_agentic_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
